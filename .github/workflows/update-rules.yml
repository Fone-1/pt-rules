name: Update PT site rules

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate rule file
        run: python generate_rules.py

      - name: Commit and push changes
        run: |
          if git diff --quiet -- PrivateTracker.list; then
            echo "Rules are unchanged; skipping commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PrivateTracker.list
          git commit -m "chore: update PT site rules"
          git push
